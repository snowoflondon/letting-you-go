<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transit landscape studies</title><link rel="stylesheet" href="styles.css"><link rel="icon" href="data:,"><style>body{padding:28px;background:#f7f2e9}main{max-width:1100px;margin:auto}h1{min-height:0;font-size:32px;justify-content:flex-start}p,figcaption{color:#696257;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px;margin:28px 0}figure{margin:0}svg{width:100%;height:auto;border-radius:18px;display:block}figcaption{padding:14px 0}a{color:#393732}</style></head><body><main><a href="./">← Back to the app</a><h1>Somewhere along the way.</h1><p>Three new transit landscapes, shown close up for artwork review. In the app they sit beneath the open sky and move with the clouds.</p><div class="grid" id="studies"></div></main><script type="module">
import {sceneFor} from './js/scenes.js?v=transit-landscapes-4';
for(const [id,label] of [['wheat-field','Wheat field · a single red tractor'],['icy-sea','Icy sea · icebergs and glacier ridge'],['autumn-forest','Autumn forest · soft reds and oranges']]){
 const figure=document.createElement('figure');figure.innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 245 400 165" role="img" aria-label="${label}"><rect x="0" y="245" width="400" height="165" fill="#dce7e8"/>${sceneFor(id)}</svg><figcaption>${label}</figcaption>`;document.getElementById('studies').append(figure);
}
</script></body></html>
